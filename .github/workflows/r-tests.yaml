name: R tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run testthat suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # testthat depends on fs, which compiles against libuv on Ubuntu.
      # Install its system headers explicitly; otherwise install.packages()
      # can warn and continue, leaving testthat unavailable in the next step.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libuv1-dev

      - name: Install test dependencies
        run: |
          Rscript -e 'install.packages("testthat", repos = "https://cloud.r-project.org")'
          Rscript -e 'stopifnot(requireNamespace("testthat", quietly = TRUE))'

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary")'
